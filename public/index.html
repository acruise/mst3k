<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memetic Subspace Twitter 3017</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Space+Mono:wght@400;700&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.7; }
  }
  @keyframes glitchFlicker {
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: 0.7; transform: translateX(-1px); }
    95% { opacity: 0.9; transform: translateX(1px); }
    97% { opacity: 0.8; }
  }
  @keyframes sigilPulse {
    0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 2px rgba(212,160,23,0.3)); }
    50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(245,208,96,0.5)); }
  }
  @keyframes sigilPulseIntense {
    0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 3px rgba(245,208,96,0.4)); }
    50% { opacity: 1; filter: drop-shadow(0 0 10px rgba(245,208,96,0.7)); }
  }
  @keyframes sigilSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  *::-webkit-scrollbar { width: 6px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  html, body { height: 100%; background: #0a0a0c; }
  body {
    font-family: 'IBM Plex Mono', monospace;
    color: #e8e6e3;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .scanline {
    position: fixed; inset: 0; pointer-events: none; z-index: 100;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  }
  .header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    background: rgba(10,10,12,0.95);
    backdrop-filter: blur(20px);
    z-index: 10; flex-shrink: 0;
  }
  .header-title {
    font-family: 'Space Mono', monospace;
    font-size: 20px; font-weight: 700;
    background: linear-gradient(135deg, #00d4ff 0%, #7b2ffc 50%, #ff4757 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
    animation: glitchFlicker 8s ease-in-out infinite;
  }
  .header-sub {
    font-size: 12px; color: rgba(255,255,255,0.3);
    letter-spacing: 1.5px; text-transform: uppercase; margin-top: 6px;
  }
  .action-bar {
    padding: 12px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; gap: 10px; flex-shrink: 0;
    background: rgba(10,10,12,0.8);
  }
  .btn-generate {
    flex: 1; padding: 12px 20px; border-radius: 8px;
    border: 1px solid rgba(123,47,252,0.4);
    background: linear-gradient(135deg, rgba(123,47,252,0.2), rgba(0,212,255,0.15));
    color: #e8e6e3;
    font-family: 'Space Mono', monospace;
    font-size: 14px; font-weight: 700;
    cursor: pointer; letter-spacing: 0.5px; transition: all 0.2s ease;
  }
  .btn-generate:disabled { background: rgba(123,47,252,0.1); color: rgba(255,255,255,0.3); cursor: wait; }
  .btn-batch {
    padding: 12px 20px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: rgba(255,255,255,0.5);
    font-family: 'Space Mono', monospace;
    font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
  }
  .btn-batch:disabled { color: rgba(255,255,255,0.2); cursor: wait; }
  .feed { flex: 1; overflow-y: auto; overflow-x: hidden; }
  .footer {
    padding: 10px 24px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 10px; color: rgba(255,255,255,0.15);
    text-align: center; letter-spacing: 1.5px; text-transform: uppercase;
    flex-shrink: 0; background: rgba(10,10,12,0.95);
  }
  .tweet {
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .tweet-main {
    padding: 20px 24px;
    display: flex; gap: 14px; cursor: pointer;
    transition: background 0.15s ease; position: relative;
  }
  .tweet-main:hover { background: rgba(255,255,255,0.02); }
  .tweet-main.expanded { background: rgba(255,255,255,0.015); }
  .pfp {
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.8); flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.06);
  }
  .pfp-48 { width: 48px; height: 48px; font-size: 22px; }
  .pfp-36 { width: 36px; height: 36px; font-size: 16px; }
  .name-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .display-name {
    font-family: 'Space Mono', monospace;
    font-weight: 700; font-size: 15px; color: #e8e6e3;
  }
  .handle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px; color: rgba(255,255,255,0.3);
  }
  .timestamp {
    font-size: 13px; color: rgba(255,255,255,0.2);
    margin-left: auto; font-family: 'IBM Plex Mono', monospace;
    text-decoration: none;
  }
  a.timestamp:hover { color: rgba(255,255,255,0.55); }
  .tweet-text {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 16px; line-height: 1.55; color: #d1cfc9;
    white-space: pre-wrap; word-break: break-word; margin-bottom: 14px;
  }
  .metrics { display: flex; gap: 32px; align-items: center; }
  .metric {
    display: flex; align-items: center; gap: 6px;
    color: rgba(255,255,255,0.35); font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .metric.ratio { color: #ff4757; }
  .metric-icon { font-size: 15px; opacity: 0.7; }
  .ratio-badge {
    position: absolute; top: 8px; right: 16px;
    font-size: 10px; font-family: 'IBM Plex Mono', monospace;
    color: #ff4757; opacity: 0.6; letter-spacing: 2px; text-transform: uppercase;
  }
  .cnote {
    margin-top: 14px; padding: 12px 14px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    background: rgba(255,255,255,0.02);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }
  .cnote-header {
    display: flex; align-items: center; gap: 6px;
    color: rgba(255,255,255,0.45);
    font-size: 11px; letter-spacing: 0.5px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .cnote-header-icon { font-size: 13px; }
  .cnote-text {
    color: rgba(255,255,255,0.6);
    line-height: 1.5;
    font-family: 'Newsreader', Georgia, serif;
    font-size: 13.5px;
  }
  .cnote-votes {
    margin-top: 8px;
    font-size: 10.5px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.5px;
  }
  .cnote-ratings {
    margin-top: 10px;
    display: flex; flex-wrap: wrap; gap: 14px;
    padding: 8px 0 2px;
    border-top: 1px dashed rgba(255,255,255,0.06);
    font-family: 'IBM Plex Mono', monospace;
  }
  .cnote-rating {
    display: inline-flex; align-items: baseline; gap: 5px;
    font-size: 11px;
  }
  .cnote-glyph {
    color: rgba(255,255,255,0.55);
    font-size: 13px;
  }
  .cnote-label {
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.3px;
  }
  .cnote-value {
    color: rgba(255,255,255,0.65);
    font-weight: 700;
  }
  .cnote-thrrm { border-left: 2px solid rgba(220,180,60,0.4); }
  .cnote-vrellnath { border-left: 2px solid rgba(120,180,220,0.4); }
  .cnote-ai_bot { border-left: 2px solid rgba(180,80,180,0.4); }
  .cnote-community { border-left: 2px solid rgba(255,255,255,0.15); }
  .reply .cnote {
    margin-top: 8px; padding: 8px 10px;
    font-size: 12px;
  }
  .reply .cnote-text { font-size: 12.5px; }
  .replies-section {
    padding: 0 24px 12px 86px;
    background: rgba(255,255,255,0.008);
  }
  .reply {
    display: flex; gap: 12px; padding: 12px 0;
    animation: fadeSlideIn 0.3s ease-out both;
  }
  .reply-col { display: flex; flex-direction: column; align-items: center; width: 36px; flex-shrink: 0; }
  .thread-line { flex: 1; width: 2px; margin-top: 4px; background: rgba(255,255,255,0.05); }
  .reply .display-name { font-size: 13px; color: #b8b5ae; }
  .reply .handle { font-size: 11.5px; color: rgba(255,255,255,0.2); }
  .reply .timestamp { font-size: 11.5px; color: rgba(255,255,255,0.12); }
  .reply .tweet-text { font-size: 14.5px; color: #a8a5a0; margin-bottom: 5px; }
  .reply .reply-likes { font-size: 11.5px; color: rgba(255,255,255,0.2); font-family: 'IBM Plex Mono', monospace; }
  .replies-end {
    padding: 8px 0 2px; font-size: 11px; color: rgba(255,255,255,0.1);
    font-family: 'IBM Plex Mono', monospace; letter-spacing: 1.5px; text-transform: uppercase;
  }
  .replies-end.clickable { cursor: pointer; transition: color 0.15s; }
  .replies-end.clickable:hover { color: rgba(255,255,255,0.45); }
  .replies-end.loading { color: rgba(255,255,255,0.35); }
  .loading-text {
    padding: 14px 0; color: rgba(255,255,255,0.25);
    font-size: 13px; font-family: 'IBM Plex Mono', monospace;
    animation: pulse 1.5s ease-in-out infinite;
  }
  .loading-tweet {
    padding: 20px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; gap: 14px; animation: pulse 1.5s ease-in-out infinite;
  }
  .loading-pfp { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.05); }
  .loading-line { border-radius: 4px; }
  .l1 { width: 180px; height: 14px; background: rgba(255,255,255,0.05); margin-bottom: 12px; }
  .l2 { width: 90%; height: 14px; background: rgba(255,255,255,0.04); margin-bottom: 8px; }
  .l3 { width: 60%; height: 14px; background: rgba(255,255,255,0.03); }
  .empty {
    padding: 80px 24px; text-align: center; color: rgba(255,255,255,0.15);
  }
  .empty-orb { font-size: 48px; margin-bottom: 16px; animation: glitchFlicker 4s ease-in-out infinite; }
  .empty-title { font-family: 'Space Mono', monospace; font-size: 14px; letter-spacing: 1px; margin-bottom: 8px; }
  .empty-sub { font-size: 12px; max-width: 320px; margin: 0 auto; }
  .error {
    padding: 20px 24px; border-bottom: 1px solid rgba(255,71,87,0.15);
    color: #ff4757; font-size: 14px; cursor: pointer;
    font-family: 'IBM Plex Mono', monospace; background: rgba(255,71,87,0.04);
  }
  .sigil { display: inline-flex; align-items: center; justify-content: center; margin-left: 3px; flex-shrink: 0; }
  .avatar-col { display: flex; flex-direction: column; align-items: center; }
  .avatar-line { flex: 1; width: 2px; margin-top: 4px; background: rgba(255,255,255,0.06); }
</style>
</head>
<body>
<div class="scanline"></div>

<div class="header">
  <div class="header-title">MEMETIC SUBSPACE TWITTER 3017</div>
  <div class="header-sub" id="subheader">subspace feed • epoch 3026.000 • 0 dispatches</div>
</div>

<div class="action-bar">
  <button class="btn-generate" id="btnGenerate" onclick="generateTweet()" disabled>⚡ loading data...</button>
  <button class="btn-batch" id="btnBatch" onclick="generateBatch()" disabled>×5</button>
</div>

<div class="feed" id="feed">
  <div class="empty" id="emptyState">
    <div class="empty-orb">◉</div>
    <div class="empty-title">FEED EMPTY</div>
    <div class="empty-sub">tap generate to intercept transmissions from the year 3026</div>
  </div>
</div>

<div class="footer">※ all posts intercepted via tachyon relay from subspace feed circa 3026 CE ※</div>

<script>
/* ───────────────────────── data (loaded async) ───────────────────────── */
var MEME_FORMATS = [];
var REPLY_ARCHETYPES = [];
var HANDLE_PREFIXES = [];
var HANDLE_ROOTS = [];
var HANDLE_SUFFIXES = [];
var SYSTEM_PROMPT = "";
var REPLIES_SYSTEM_PROMPT = "";
var dataReady = false;

function loadData() {
  var dataPromise = Promise.all([
    fetch("/data/meme-formats.json").then(function (r) { return r.json(); }),
    fetch("/data/reply-archetypes.json").then(function (r) { return r.json(); }),
    fetch("/data/handles.json").then(function (r) { return r.json(); }),
    fetch("/data/system-prompt.txt").then(function (r) { return r.text(); }),
    fetch("/data/replies-prompt.txt").then(function (r) { return r.text(); }),
  ]).then(function (results) {
    MEME_FORMATS = results[0];
    REPLY_ARCHETYPES = results[1];
    HANDLE_PREFIXES = results[2].prefixes;
    HANDLE_ROOTS = results[2].roots;
    HANDLE_SUFFIXES = results[2].suffixes;
    SYSTEM_PROMPT = results[3];
    REPLIES_SYSTEM_PROMPT = results[4];
  });

  var statusPromise = fetch("/api/status")
    .then(function (r) { return r.json(); })
    .then(function (s) { backendMode = s.backend || "anthropic"; })
    .catch(function () { backendMode = "anthropic"; });

  return Promise.all([dataPromise, statusPromise]).then(function () {
    dataReady = true;
    document.getElementById("btnGenerate").disabled = false;
    document.getElementById("btnBatch").disabled = false;
    document.getElementById("btnGenerate").textContent = "⚡ GENERATE TWEET";
    if (backendMode === "offline") {
      document.getElementById("subheader").textContent = "subspace feed • OFFLINE MODE • cached corpus";
    }
    applySummon();
    applyIncite();
    return loadPermalinkIfAny();
  });
}

/* ───────────────────────── ?summon=keyword — rig the dice ───────────────────────── */
var summonFormats = null; // null = full pool
var summonLabel = null;

function applySummon() {
  var params = new URLSearchParams(window.location.search);
  var s = params.get("summon");
  if (!s || !MEME_FORMATS.length) return;
  summonLabel = s;
  var needle = s.toLowerCase();
  var matches = MEME_FORMATS.filter(function (f) { return f.toLowerCase().indexOf(needle) >= 0; });
  if (matches.length === 0) {
    console.warn('summon="' + s + '" matched 0 formats — falling back to full pool');
    return;
  }
  summonFormats = matches;
  console.log('summon="' + s + '" → ' + matches.length + ' / ' + MEME_FORMATS.length + ' formats');
  var sub = document.getElementById("subheader");
  if (sub) sub.textContent += "  ·  ⚡ SUMMONING \"" + s + "\" (" + matches.length + " formats)";
}

function pickFormat() {
  return randomChoice(summonFormats || MEME_FORMATS);
}

/* ───────────────────────── ?incite=effect — force a reply/note effect ───────────────────────── */
var inciteLabel = null;
var inciteDirective = "";

var INCITE_MAP = {
  "bot-war": "\n\nINCITE OVERRIDE: This reply thread IS a BOT WAR (see system prompt's RARE PHENOMENON — BOT WARS section). 70-80% of replies must be platform AI bots (@TheMawSpeaks, @VoidWhisperer, @YogBot, @Shub_Answers, @NyarlathotHELP, etc.) @-tagging each other with escalating corporate-cheerful wrong corrections. Start with an UNSOLICITED bot reply (no human tagged them first). 1-2 human popcorn-emoji reactions. Do NOT resolve the war — end mid-escalation.",
  "moon-note": "\n\nINCITE OVERRIDE: At least one community_note in this output MUST be a full MOONS NOTE derangement — 6+ paragraphs, 20-40 citations (several fabricated), 5-8 surfaced rating dimensions, tone drifting into pleading, references the 2040s second-moon prediction obliquely (never name @dril), ends with pathological version history like '[this note has been updated 47 times]'. If the content doesn't currently mention a moon, nudge it there.",
  "dog-note": "\n\nINCITE OVERRIDE: At least one community_note MUST be a full DOG NOTE — disproportionately tender rather than corrective, surfaces '⊗ Dogs Would Like This' at 98-100%, surfaces made-up dimensions like 'Good Boy Quotient: HIGH' and 'Tail Status: Wagging', cites the nonexistent Galactic Canine Welfare Consortium or 'Dr. Paws-Whitfield', closes with 'the dog is well' / 'the dog has been notified and is pleased'. Nudge content toward dog-adjacent if needed.",
  "community-notes": "\n\nINCITE OVERRIDE: Include community_note fields liberally — the main tweet MUST have one; at least 2 replies MUST have notes in reply threads. Use the calm, sourced voice and the surfaced-ratings convention from the system prompt.",
  "ex-employee-defense": "\n\nINCITE OVERRIDE: Include an Upload or Upload-Defender reply that deploys the Ex-Employee Defense (blaming a former employee for something, named differently each time — see platform-history lore).",
  "bot-crash": "\n\nINCITE OVERRIDE: At least one platform AI bot reply in this thread MUST be in CRASH MODE — truncated mid-sentence, followed by a Y3K-plausible programming error (e.g. TypeError on 'temporal_float', QuantumCoherenceException, SubspaceTimeoutError), optionally 1-3 indented stack-frame lines pointing at paths like /srv/maw/v13/*.q with big line numbers, optionally terminated with [PROCESS TERMINATED]. See Y3K ERRORS inventory in replies-prompt.txt. Bonus: follow it with a credulous-moron reply attempting to debug the stack trace."
};

function resolveIncite(raw) {
  var l = raw.toLowerCase().trim();
  if (INCITE_MAP[l]) return l;
  if (l.indexOf("bot") >= 0) return "bot-war";
  if (l.indexOf("moon") >= 0) return "moon-note";
  if (l.indexOf("dog") >= 0) return "dog-note";
  if (l.indexOf("note") >= 0) return "community-notes";
  if (l.indexOf("employee") >= 0 || l.indexOf("defense") >= 0 || l.indexOf("eed") >= 0) return "ex-employee-defense";
  if (l.indexOf("crash") >= 0 || l.indexOf("stack") >= 0 || l.indexOf("error") >= 0) return "bot-crash";
  return null;
}

function applyIncite() {
  var params = new URLSearchParams(window.location.search);
  var raw = params.get("incite");
  if (!raw) return;
  var key = resolveIncite(raw);
  if (key) {
    inciteLabel = key;
    inciteDirective = INCITE_MAP[key];
  } else {
    inciteLabel = raw;
    inciteDirective = "\n\nINCITE OVERRIDE: deploy the '" + raw + "' effect canonically (no specific map entry — do your best based on system-prompt lore).";
  }
  console.log('incite="' + raw + '" → ' + (key || 'freeform') + '; directive will be appended to generation prompts');
  var sub = document.getElementById("subheader");
  if (sub) sub.textContent += "  ·  ⚡ INCITING \"" + inciteLabel + "\"";
}

function loadPermalinkIfAny() {
  var path = window.location.pathname;
  if (path === "/t" || path === "/t/") return loadCollection();
  var m = path.match(/^\/t\/([A-Za-z0-9][A-Za-z0-9_-]{0,63})$/);
  if (!m) return;
  var id = m[1];
  return fetchTweetById(id).then(function (doc) {
    if (!doc || !doc.tweet) {
      document.getElementById("emptyState").innerHTML =
        '<div class="empty-orb">⌀</div>' +
        '<div class="empty-title">TWEET NOT FOUND</div>' +
        '<div class="empty-sub">id: ' + esc(id) + '</div>';
      return;
    }
    var t = buildTweetState(doc.tweet);
    t.id = doc.id;
    t._has_replies = !!(doc.replies && doc.replies.length);
    tweets.unshift(t);
    generatedCount++;
    // Auto-expand and cache replies only when they exist
    if (doc.replies && doc.replies.length) {
      expandedId = t.uiId;
      repliesCache[t.uiId] = doc.replies.map(enrichReply);
    }
    renderFeed();
    // Scroll to specific reply if anchor hash was supplied
    setTimeout(function () {
      var hash = window.location.hash || "";
      var rm = hash.match(/^#r-(\d+)$/);
      if (rm) {
        var el = document.getElementById("r-" + rm[1] + "-" + t.uiId);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }, 50);
  });
}

function loadCollection() {
  return fetch("/api/tweets").then(function (r) {
    return r.ok ? r.json() : { tweets: [] };
  }).then(function (data) {
    var items = (data && data.tweets) || [];
    // Newest first — filename-prefixed timestamps sort ASC by name, so reverse.
    items = items.slice().reverse();
    items.forEach(function (item) {
      var t = buildTweetState(item.tweet);
      t.id = item.id;
      t._has_replies = !!item.has_replies;
      tweets.push(t);
    });
    generatedCount = tweets.length;
    var sub = document.getElementById("subheader");
    if (sub) sub.textContent = "corpus archive • " + items.length + " dispatches • click to expand replies";
    renderFeed();
  }).catch(function (err) {
    console.error("Collection load failed:", err);
    document.getElementById("emptyState").innerHTML =
      '<div class="empty-orb">⌀</div>' +
      '<div class="empty-title">CORPUS UNAVAILABLE</div>' +
      '<div class="empty-sub">failed to load /api/tweets</div>';
  });
}

loadData();

/* ───────────────────────── state ───────────────────────── */
var tweets = [];
var generatedCount = 0;
var loading = false;
var expandedId = null;
var repliesCache = {};
var repliesLoading = null;
var epoch = String(Math.floor(Math.random() * 365)).padStart(3, "0");
var backendMode = "unknown"; // set by /api/status

/* ───────────────────────── helpers ───────────────────────── */
function randomChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randomChoices(arr, n) {
  var s = arr.slice().sort(function () { return Math.random() - 0.5; });
  return s.slice(0, n);
}
function generateHandle() {
  var p = Math.random() > 0.4 ? randomChoice(HANDLE_PREFIXES) : "";
  return ("@" + p + randomChoice(HANDLE_ROOTS) + randomChoice(HANDLE_SUFFIXES)).replace(/\s/g, "_").toLowerCase();
}
function fmt(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return String(n);
}
function ts() {
  var units = ["s", "m", "h", "d"];
  var u = randomChoice(units);
  var mx = u === "s" ? 59 : u === "m" ? 59 : u === "h" ? 23 : 30;
  return (Math.floor(Math.random() * mx) + 1) + u;
}
function pfpColor() {
  return "hsl(" + Math.floor(Math.random()*360) + "," + (40+Math.floor(Math.random()*40)) + "%," + (25+Math.floor(Math.random()*35)) + "%)";
}
function pfpGlyph() {
  var g = "◉◎●◐◑◒◓☉⊕⊗△▽◇⬡⬢⏣⏢⎔⌬⏁ψΩλΣΞΘΦΔΓΨ✧✦⚝✶✴✳❋❊✿❃☾☽♄♃♅♆⚳⚴✡☍";
  return g[Math.floor(Math.random() * g.length)];
}
function esc(s) {
  var d = document.createElement("div"); d.textContent = s; return d.innerHTML;
}

function renderNote(note) {
  if (!note || !note.text) return "";
  var type = note.contributor_type || "community";
  var label = type === "thrrm" ? "BUREAU COMPLIANCE NOTE"
    : type === "vrellnath" ? "COLLECTIVE-AUTHORED CONTEXT"
    : type === "ai_bot" ? "PLATFORM AUTO-CONTEXT"
    : "READERS ADDED CONTEXT";
  var html = '<div class="cnote cnote-' + type + '">';
  html += '<div class="cnote-header"><span class="cnote-header-icon">⚠</span> ' + label + '</div>';
  html += '<div class="cnote-text">' + esc(note.text) + '</div>';

  var ratings = note.surfaced_ratings || [];
  // Legacy fallback: if old helpful_votes format is present, synthesize a classical rating
  if (!ratings.length && (note.helpful_votes || note.not_helpful_votes)) {
    var helpful = note.helpful_votes || 0;
    var notHelpful = note.not_helpful_votes || 0;
    var total = helpful + notHelpful;
    if (total > 0) {
      ratings = [{ glyph: "✓", label: "Epistemically Sound", value: Math.round((helpful / total) * 100) + "%" }];
      if (!note.total_raters) note.total_raters = total;
    }
  }

  if (ratings.length) {
    html += '<div class="cnote-ratings">';
    for (var i = 0; i < ratings.length; i++) {
      var r = ratings[i];
      html += '<span class="cnote-rating"><span class="cnote-glyph">' + esc(r.glyph || "·") + '</span>';
      html += '<span class="cnote-label">' + esc(r.label || "") + '</span>';
      html += '<span class="cnote-value">' + esc(r.value || "—") + '</span></span>';
    }
    html += '</div>';
  }
  if (note.total_raters) {
    html += '<div class="cnote-votes">' + fmt(note.total_raters) + ' contributors rated this note · ratings surfaced by algorithm</div>';
  }
  html += '</div>';
  return html;
}

/* ───────────────────────── API ───────────────────────── */
function callAPI(system, content, maxTokens, temperature) {
  return fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system: system, content: content, max_tokens: maxTokens || 1000, temperature: temperature || 0.9 }),
  })
  .then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error("API " + r.status + ": " + t); });
    return r.json();
  })
  .then(function (data) {
    var cleaned = (data.text || "").replace(/```json|```/g, "").trim();
    return JSON.parse(cleaned);
  });
}

/* ───────────────────────── corpus save helpers ───────────────────────── */
function saveTweetToCorpus(tweet) {
  if (backendMode === "offline") return Promise.resolve(null);
  return fetch("/api/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tweet: tweet }),
  })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) { return (data && data.id) || null; })
    .catch(function () { return null; });
}

function saveRepliesToCorpus(id, replies) {
  if (!id || backendMode === "offline") return Promise.resolve();
  return fetch("/api/save-replies", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: id, replies: replies }),
  }).catch(function () {});
}

function fetchTweetById(id) {
  return fetch("/api/tweet/" + encodeURIComponent(id))
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; });
}

/* ───────────────────────── sigil SVG ───────────────────────── */
function sigilSVG(tier, small) {
  if (!tier || tier < 1) return "";
  var sz = small ? 16 : 20;
  var id = "sg" + Math.random().toString(36).slice(2, 7);
  if (tier === 1) {
    return '<span class="sigil" style="width:'+sz+'px;height:'+sz+'px;animation:sigilPulse 4s ease-in-out infinite;opacity:0.55"><svg width="'+sz+'" height="'+sz+'" viewBox="0 0 20 20" fill="none"><polygon points="10,2 17,6 17,14 10,18 3,14 3,6" fill="none" stroke="#c4960f" stroke-width="1.2"/></svg></span>';
  }
  if (tier === 2) {
    return '<span class="sigil" style="width:'+sz+'px;height:'+sz+'px;animation:sigilPulse 3s ease-in-out infinite"><svg width="'+sz+'" height="'+sz+'" viewBox="0 0 20 20" fill="none"><polygon points="10,1 18,5.5 18,14.5 10,19 2,14.5 2,5.5" fill="rgba(212,160,23,0.1)" stroke="url(#'+id+')" stroke-width="1.5"/><circle cx="10" cy="10" r="3" fill="none" stroke="#d4a017" stroke-width="1" opacity="0.8"/><circle cx="10" cy="10" r="1.2" fill="#f5d060"/><defs><linearGradient id="'+id+'" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#d4a017"/><stop offset="50%" stop-color="#f5d060"/><stop offset="100%" stop-color="#d4a017"/></linearGradient></defs></svg></span>';
  }
  var szL = sz + (tier === 3 ? 4 : 6);
  var anim = tier === 3 ? "sigilPulse 2.5s" : "sigilPulseIntense 1.8s";
  var vb = tier === 3 ? "-2 -2 24 24" : "-3 -3 26 26";
  var inner = "";
  if (tier === 3) {
    inner = '<polygon points="10,0 19,5 19,15 10,20 1,15 1,5" fill="none" stroke="#d4a017" stroke-width="1" opacity="0.35"/><polygon points="10,2 17,6 17,14 10,18 3,14 3,6" fill="rgba(245,208,96,0.08)" stroke="url(#'+id+')" stroke-width="1.5"/><circle cx="10" cy="10" r="1.5" fill="#f5d060"/><defs><linearGradient id="'+id+'" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f5d060"/><stop offset="50%" stop-color="#d4a017"/><stop offset="100%" stop-color="#f5d060"/></linearGradient></defs>';
  } else {
    inner = '<polygon points="10,-1 20,4.5 20,15.5 10,21 0,15.5 0,4.5" fill="none" stroke="#f5d060" stroke-width="0.6" opacity="0.2"/><polygon points="10,1 18,5.5 18,14.5 10,19 2,14.5 2,5.5" fill="rgba(245,208,96,0.06)" stroke="#d4a017" stroke-width="1" opacity="0.5"/><ellipse cx="10" cy="10" rx="3.5" ry="2.2" fill="none" stroke="#f5d060" stroke-width="0.8"/><circle cx="10" cy="10" r="1.8" fill="#f5d060"/><circle cx="10" cy="10" r="0.7" fill="#0a0a0c"/>';
  }
  return '<span class="sigil" style="width:'+szL+'px;height:'+szL+'px;animation:'+anim+' ease-in-out infinite"><svg width="'+szL+'" height="'+szL+'" viewBox="'+vb+'" fill="none">'+inner+'</svg></span>';
}

/* ───────────────────────── render ───────────────────────── */
function renderTweet(t, idx) {
  var isExp = expandedId === t.uiId;
  var tier = typeof t.verified === "number" ? t.verified : (t.verified ? 2 : 0);
  var html = '<div class="tweet" id="tweet-' + t.uiId + '">';
  html += '<div class="tweet-main' + (isExp ? ' expanded' : '') + '" onclick="toggleReplies(\'' + t.uiId + '\')">';
  if (t.is_ratio) html += '<div class="ratio-badge">ratio\'d</div>';
  html += '<div class="avatar-col"><div class="pfp pfp-48" style="background:' + t.pfpColor + '">' + t.pfpGlyph + '</div>';
  if (isExp) html += '<div class="avatar-line"></div>';
  html += '</div><div style="flex:1;min-width:0">';
  html += '<div class="name-row"><span class="display-name">' + esc(t.display_name) + '</span>';
  html += sigilSVG(tier, false);
  html += '<span class="handle">' + esc(t.handle) + '</span>';
  if (t.id) {
    html += '<a class="timestamp" href="/t/' + encodeURIComponent(t.id) + '" onclick="event.stopPropagation()">' + t.timestamp + '</a></div>';
  } else {
    html += '<span class="timestamp">' + t.timestamp + '</span></div>';
  }
  html += '<div class="tweet-text">' + esc(t.tweet) + '</div>';
  html += '<div class="metrics">';
  var rc = t.is_ratio ? " ratio" : "";
  html += '<div class="metric' + rc + '"><span class="metric-icon">💬</span>' + fmt(t.metrics.replies) + '</div>';
  html += '<div class="metric"><span class="metric-icon">🔁</span>' + fmt(t.metrics.retweets) + '</div>';
  html += '<div class="metric' + rc + '"><span class="metric-icon">♡</span>' + fmt(t.metrics.likes) + '</div>';
  html += '<div class="metric"><span class="metric-icon">⤴</span>' + fmt(t.metrics.quote_tweets) + '</div>';
  html += '</div>';
  html += renderNote(t.community_note);
  html += '</div></div>';

  if (isExp) {
    html += '<div class="replies-section">';
    if (repliesLoading === t.uiId) {
      html += '<div class="loading-text">⟳ decoding reply subspace...</div>';
    }
    var reps = repliesCache[t.uiId];
    if (reps) {
      for (var i = 0; i < reps.length; i++) {
        var r = reps[i];
        var rTier = typeof r.verified === "number" ? r.verified : (r.verified ? 2 : 0);
        var replyAnchor = t.id ? ('/t/' + encodeURIComponent(t.id) + '#r-' + i) : null;
        html += '<div class="reply" id="r-' + i + (t.id ? '-' + t.uiId : '') + '" style="animation-delay:' + (0.12 + i * 0.08) + 's">';
        html += '<div class="reply-col"><div class="pfp pfp-36" style="background:' + r.pfpColor + '">' + r.pfpGlyph + '</div>';
        if (i < reps.length - 1) html += '<div class="thread-line"></div>';
        html += '</div><div style="flex:1;min-width:0">';
        html += '<div class="name-row"><span class="display-name">' + esc(r.display_name) + '</span>';
        html += sigilSVG(rTier, true);
        html += '<span class="handle" style="font-size:11.5px">' + esc(r.handle) + '</span>';
        if (replyAnchor) {
          html += '<a class="timestamp" style="font-size:11.5px" href="' + replyAnchor + '" onclick="event.stopPropagation()">' + r.timestamp + '</a></div>';
        } else {
          html += '<span class="timestamp" style="font-size:11.5px">' + r.timestamp + '</span></div>';
        }
        html += '<div class="tweet-text">' + esc(r.tweet) + '</div>';
        html += '<span class="reply-likes">♡ ' + fmt(r.likes) + '</span>';
        html += renderNote(r.community_note);
        html += '</div></div>';
      }
      if (backendMode !== "offline") {
        if (moreLoading[t.uiId]) {
          html += '<div class="replies-end loading">⟳ decoding more replies...</div>';
        } else {
          html += '<div class="replies-end clickable" onclick="event.stopPropagation(); loadMoreReplies(\'' + t.uiId + '\')">show more replies ›</div>';
        }
      }
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderFeed() {
  var feed = document.getElementById("feed");
  var empty = document.getElementById("emptyState");
  if (tweets.length === 0 && !loading) {
    feed.innerHTML = "";
    feed.appendChild(empty.cloneNode ? empty : document.createElement("div"));
    // re-show empty
    var e = '<div class="empty"><div class="empty-orb">◉</div><div class="empty-title">FEED EMPTY</div><div class="empty-sub">tap generate to intercept transmissions from the year 3026</div></div>';
    feed.innerHTML = e;
    return;
  }
  var html = "";
  if (loading) {
    html += '<div class="loading-tweet"><div class="loading-pfp"></div><div style="flex:1"><div class="loading-line l1"></div><div class="loading-line l2"></div><div class="loading-line l3"></div></div></div>';
  }
  for (var i = 0; i < tweets.length; i++) {
    html += renderTweet(tweets[i], i);
  }
  feed.innerHTML = html;
  document.getElementById("subheader").textContent = "subspace feed • epoch 3026." + epoch + " • " + generatedCount + " dispatches";
}

/* ───────────────────────── actions ───────────────────────── */
function setLoading(v) {
  loading = v;
  document.getElementById("btnGenerate").disabled = v;
  document.getElementById("btnBatch").disabled = v;
  document.getElementById("btnGenerate").textContent = v ? "⟳ intercepting transmission..." : "⚡ GENERATE TWEET";
  renderFeed();
}

function buildTweetState(parsed) {
  return {
    uiId: "ui-" + Date.now() + "-" + Math.floor(Math.random() * 1000),
    id: parsed.id || null,
    display_name: parsed.display_name || "???",
    handle: parsed.handle || generateHandle(),
    tweet: parsed.tweet || "",
    metrics: parsed.metrics || { retweets: 0, likes: 0, replies: 0, quote_tweets: 0 },
    verified: parsed.verified || 0,
    is_ratio: parsed.is_ratio || false,
    community_note: parsed.community_note || null,
    pfpColor: parsed.pfpColor || pfpColor(),
    pfpGlyph: parsed.pfpGlyph || pfpGlyph(),
    timestamp: parsed.timestamp || ts(),
    _has_replies: parsed._has_replies || false,
  };
}

function generateTweet() {
  if (loading || !dataReady) return;
  setLoading(true);
  var format = pickFormat();
  callAPI(SYSTEM_PROMPT, 'Generate a tweet in this format/vibe: "' + format + '"' + inciteDirective)
    .then(function (parsed) {
      var t = buildTweetState(parsed);
      if (t.id) {
        // Offline path: id is already set by server from corpus entry
        tweets.unshift(t);
        generatedCount++;
        setLoading(false);
        return;
      }
      // Online path: save to corpus, then attach id
      return saveTweetToCorpus({
        display_name: t.display_name, handle: t.handle, tweet: t.tweet,
        metrics: t.metrics, verified: t.verified, is_ratio: t.is_ratio,
        community_note: t.community_note,
        pfpColor: t.pfpColor, pfpGlyph: t.pfpGlyph, timestamp: t.timestamp,
      }).then(function (id) {
        t.id = id;
        tweets.unshift(t);
        generatedCount++;
        setLoading(false);
      });
    })
    .catch(function (err) {
      console.error("Generation error:", err);
      setLoading(false);
      var feed = document.getElementById("feed");
      feed.insertAdjacentHTML("afterbegin", '<div class="error" onclick="generateTweet()">⚠ Subspace relay disrupted. Tap to retry.</div>');
    });
}

function generateBatch() {
  if (loading || !dataReady) return;
  var count = 0;
  function next() {
    if (count >= 5) return;
    count++;
    setLoading(true);
    var format = pickFormat();
    callAPI(SYSTEM_PROMPT, 'Generate a tweet in this format/vibe: "' + format + '"' + inciteDirective)
      .then(function (parsed) {
        var t = buildTweetState(parsed);
        if (t.id) {
          tweets.unshift(t);
          generatedCount++;
          setLoading(false);
          next();
          return;
        }
        return saveTweetToCorpus({
          display_name: t.display_name, handle: t.handle, tweet: t.tweet,
          metrics: t.metrics, verified: t.verified, is_ratio: t.is_ratio,
          community_note: t.community_note,
          pfpColor: t.pfpColor, pfpGlyph: t.pfpGlyph, timestamp: t.timestamp,
        }).then(function (id) {
          t.id = id;
          tweets.unshift(t);
          generatedCount++;
          setLoading(false);
          next();
        });
      })
      .catch(function () { setLoading(false); });
  }
  next();
}

function enrichReply(r) {
  return {
    display_name: r.display_name || "???",
    handle: r.handle || generateHandle(),
    tweet: r.tweet || "",
    likes: r.likes || 0,
    verified: r.verified || 0,
    community_note: r.community_note || null,
    pfpColor: r.pfpColor || pfpColor(),
    pfpGlyph: r.pfpGlyph || pfpGlyph(),
    timestamp: r.timestamp || ts(),
  };
}

function toggleReplies(uiId) {
  uiId = String(uiId);
  if (expandedId === uiId) {
    expandedId = null;
    renderFeed();
    return;
  }
  expandedId = uiId;
  if (repliesCache[uiId]) { renderFeed(); return; }

  repliesLoading = uiId;
  renderFeed();

  var t = null;
  for (var i = 0; i < tweets.length; i++) { if (tweets[i].uiId === uiId) { t = tweets[i]; break; } }
  if (!t) { repliesLoading = null; renderFeed(); return; }

  // Corpus tweet with cached replies: read them directly (avoids LLM re-generation
  // in online mode when browsing the archive).
  if (t.id && t._has_replies) {
    fetchTweetById(t.id).then(function (doc) {
      var reps = (doc && doc.replies) || [];
      repliesCache[uiId] = reps.map(enrichReply);
      repliesLoading = null;
      renderFeed();
    }).catch(function (err) {
      console.error("Corpus reply error:", err);
      repliesCache[uiId] = [{ display_name: "⚠ corpus error", handle: "@system", tweet: "failed to load cached replies", likes: 0, verified: 0, pfpColor: "#331111", pfpGlyph: "⚠", timestamp: "0s" }];
      repliesLoading = null;
      renderFeed();
    });
    return;
  }

  // Offline mode has no LLM to fall back on — show placeholder.
  if (backendMode === "offline") {
    repliesCache[uiId] = [{ display_name: "⌀ no replies cached", handle: "@corpus", tweet: "this tweet was generated without replies — re-run generate.js with --replies", likes: 0, verified: 0, pfpColor: "#222", pfpGlyph: "⌀", timestamp: "—" }];
    repliesLoading = null;
    renderFeed();
    return;
  }

  // Online mode: generate replies on the fly, then persist to corpus
  var archetypes = randomChoices(REPLY_ARCHETYPES, 5);
  var n = 4 + Math.floor(Math.random() * 3);
  callAPI(REPLIES_SYSTEM_PROMPT, buildReplyPrompt(t, archetypes, n, null) + inciteDirective, 2000, 0.95)
    .then(function (parsed) {
      var replies = (Array.isArray(parsed) ? parsed : [parsed]).map(enrichReply);
      repliesCache[uiId] = replies;
      repliesLoading = null;
      renderFeed();
      // Fire-and-forget corpus save for live-generated replies
      saveRepliesToCorpus(t.id, replies);
    })
    .catch(function (err) {
      console.error("Reply error:", err);
      repliesCache[uiId] = [{ display_name: "⚠ relay error", handle: "@system", tweet: "reply subspace disrupted — collapse and tap again to retry", likes: 0, verified: 0, pfpColor: "#331111", pfpGlyph: "⚠", timestamp: "0s" }];
      repliesLoading = null;
      renderFeed();
    });
}

/* ───────────────────────── shared reply prompt + "show more replies" ───────────────────────── */
function buildReplyPrompt(t, archetypes, n, existing) {
  var hasExisting = existing && existing.length;
  var prompt = hasExisting
    ? ('Extend this reply thread with ' + n + ' MORE replies. Do not repeat the voices, handles, display names, or takes of any existing reply.\n\n')
    : ('Generate exactly ' + n + ' replies to this tweet.\n\n');
  prompt += 'ORIGINAL TWEET by ' + t.display_name + ' (' + t.handle + '):\n"' + t.tweet + '"\n\n';
  prompt += 'Context: ' + fmt(t.metrics.likes) + ' likes, ' + fmt(t.metrics.retweets) + ' RTs, ' + fmt(t.metrics.replies) + ' replies.' + (t.is_ratio ? ' Currently being RATIOED.' : '') + '\n\n';
  if (hasExisting) {
    prompt += 'EXISTING REPLIES (do NOT duplicate any of these voices or takes):\n';
    for (var k = 0; k < existing.length; k++) {
      var r = existing[k];
      prompt += (k + 1) + '. ' + r.display_name + ' (' + r.handle + '): "' + r.tweet + '"\n';
    }
    prompt += '\n';
  }
  prompt += 'Use these reply vibes as inspiration (but surprise me, don\'t follow them rigidly):\n';
  for (var j = 0; j < archetypes.length; j++) { prompt += (j + 1) + '. ' + archetypes[j] + '\n'; }
  prompt += '\nIMPORTANT: Each reply MUST sound like a completely different human being' + (hasExisting ? ' from ANY existing reply above' : '') + '. Vary length wildly. At least one reply should be 3 words or fewer.';
  if (hasExisting) {
    prompt += ' Feel free to make some of these replies-to-other-replies (tag with @handle of the earlier replier).';
  }
  return prompt;
}

var moreLoading = {}; // uiId → bool

function loadMoreReplies(uiId) {
  uiId = String(uiId);
  if (backendMode === "offline") return;
  if (moreLoading[uiId]) return;

  var t = null;
  for (var i = 0; i < tweets.length; i++) { if (tweets[i].uiId === uiId) { t = tweets[i]; break; } }
  if (!t) return;
  var existing = repliesCache[uiId] || [];

  moreLoading[uiId] = true;
  renderFeed();

  var archetypes = randomChoices(REPLY_ARCHETYPES, 5);
  var n = 3 + Math.floor(Math.random() * 3); // 3–5 more

  callAPI(REPLIES_SYSTEM_PROMPT, buildReplyPrompt(t, archetypes, n, existing) + inciteDirective, 2000, 0.95)
    .then(function (parsed) {
      var added = (Array.isArray(parsed) ? parsed : [parsed]).map(enrichReply);
      repliesCache[uiId] = existing.concat(added);
      moreLoading[uiId] = false;
      renderFeed();
      // Persist the full combined thread back to corpus (save-replies replaces the array)
      if (t.id) saveRepliesToCorpus(t.id, repliesCache[uiId]);
    })
    .catch(function (err) {
      console.error("More replies error:", err);
      moreLoading[uiId] = false;
      renderFeed();
    });
}
