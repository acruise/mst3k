<VirtualHost *:443>
    ServerName mst3k.cluonflux.com

    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/mst3k.cluonflux.com.crt
    SSLCertificateKeyFile /etc/pki/tls/private/mst3k.cluonflux.com.key

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3017/
    ProxyPassReverse / http://127.0.0.1:3017/

    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog logs/mst3k-error_log
    CustomLog logs/mst3k-access_log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName mst3k.cluonflux.com
    Redirect permanent / https://mst3k.cluonflux.com/
</VirtualHost>
